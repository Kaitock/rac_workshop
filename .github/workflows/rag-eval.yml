name: rag-eval

on:
  push:
  pull_request:

jobs:
  test-and-eval:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install requirements
        run: pip install -r requirements.txt

      - name: Tests
        run: pytest -q

      - name: Tests (W4 targets)
        run: pytest -q -m w4

      # rag.evaluate เขียนตารางผลลง Job Summary เองผ่าน $GITHUB_STEP_SUMMARY
      - name: Retrieval eval (tfidf · dev)
        run: python -m rag.evaluate --split dev --method tfidf -k 4 --min-hit 0.9

      - name: Retrieval eval (hybrid · dev)
        run: python -m rag.evaluate --split dev --method hybrid -k 4 --min-hit 0.9
